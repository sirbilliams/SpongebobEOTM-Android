name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to publish the "latest" release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch SDL2 + gl4es (pinned)
        run: bash fetch-deps.sh

      # A stable signing key from the repo secrets (if set), so each APK installs over the last one.
      # Without it Gradle signs with a fresh debug key on every run (Android then refuses the update).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often carry a stray newline or space: neither value contains whitespace.
            PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/negatron.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/negatron.keystore" -storepass "$PW" -alias negatron > /dev/null; then
              echo "::error::NEG_KEYSTORE_B64 / NEG_KEYSTORE_PASSWORD don't open the key: re-paste both secrets"
              exit 1
            fi
            echo "NEG_KEYSTORE=$RUNNER_TEMP/negatron.keystore" >> "$GITHUB_ENV"
            echo "NEG_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "stable signing key: yes"
          else
            echo "::warning::No NEG_KEYSTORE_B64 secret: signed with a one-off debug key (won't install over an older APK)"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Neutron-vs-Negatron.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Neutron-vs-Negatron-apk
          path: out/Neutron-vs-Negatron.apk
          if-no-files-found: error

      # Every push to main replaces the "latest" pre-release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/download/latest/Neutron-vs-Negatron.apk
      # It also carries the same APK under its old name, Negatron-Viewer.apk, so old links keep working.
      - name: Publish as the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/Neutron-vs-Negatron.apk out/Negatron-Viewer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Neutron-vs-Negatron.apk out/Negatron-Viewer.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Built automatically from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

      # A pushed version tag (v1.0, v1.1...) makes a permanent release named after it, with the APK and
      # the tag's section of CHANGELOG.md ("## v1.0" up to the next "## ") as its notes. The "latest"
      # pre-release above is untouched; releases/latest/download/... points at the newest tag release.
      - name: Publish the release for a version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## $TAG" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Neutron vs Negatron $TAG (no CHANGELOG.md section for this tag)" > notes.md
          cat notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/Neutron-vs-Negatron.apk --clobber
          else
            gh release create "$TAG" out/Neutron-vs-Negatron.apk --verify-tag \
              --title "Neutron vs Negatron $TAG" --notes-file notes.md
          fi

  linux:
    name: Linux desktop build (engine check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev zlib1g-dev cmake
      - name: Build engine, viewer, samples, data test
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"
